<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aramco Stadium · Take your seat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;900&family=Nunito:wght@800&family=Playfair+Display:wght@700&display=swap" />
  <link rel="stylesheet" href="/src/ui/theme.css" />
  <!-- KTX2 transcoder: fetched in parallel with the app instead of after the first texture request -->
  <link rel="preload" href="/basis/basis_transcoder.js" as="fetch" crossorigin="anonymous" />
  <link rel="preload" href="/basis/basis_transcoder.wasm" as="fetch" crossorigin="anonymous" />
</head>
<body>
  <header id="header"></header>
  <div id="app">
    <aside id="sidebar" aria-label="Tickets"></aside>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="controls"></div>
      <div id="tooltip" hidden></div>
    </main>
  </div>
  <div id="checkout" class="modal" hidden></div>
  <div id="overlay"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
